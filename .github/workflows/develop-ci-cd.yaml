name: Build and Deploy Docker Image (Develop)

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

jobs:
  build-and-deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: develop

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercased image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t "${IMAGE_NAME}:develop" .

      - name: Push Docker image
        run: |
          docker push "${IMAGE_NAME}:develop"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.35.2"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config

      - name: Deploy to K8s
        run: |
          kubectl -n entebus delete deployment entebus-server || true
          kubectl -n entebus rollout status deployment/entebus-server --timeout=120s
