name: Build and Deploy Docker Image (Develop)

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

jobs:
  build-and-deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: develop

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercased image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE_NAME}:develop-latest" \
            -t "${IMAGE_NAME}:develop-${SHORT_SHA}" \
            .

      - name: Push Docker image
        run: |
          docker push "${IMAGE_NAME}:develop-latest"
          docker push "${IMAGE_NAME}:develop-${SHORT_SHA}"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.35.2"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config

      - name: Deploy to K8s
        run: |
          (kubectl -n entebus set image deployment/entebus-server entebus-server=${IMAGE_NAME}:develop-${SHORT_SHA} && \
          kubectl -n entebus rollout status deployment/entebus-server --timeout=180s) || \
          (kubectl -n entebus rollout undo deployment/entebus-server && exit 1)

      - name: Clean up old develop images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 5
          delete-only-package-versions-matching: "^develop-\\d"
          ignore-versions: "^develop-latest$"
          token: ${{ secrets.GITHUB_TOKEN }}
