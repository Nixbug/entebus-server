name: Manual Branch Deploy (Develop)

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: Branch to build and deploy to develop
        required: true
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: develop
    concurrency:
      group: entebus-develop-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch_name }}

      - name: Log selected branch
        run: |
          echo "Deploying branch: ${{ github.event.inputs.branch_name }}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image variables
        run: |
          RAW_BRANCH="${{ github.event.inputs.branch_name }}"
          BRANCH_TAG=$(echo "$RAW_BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9]+#-#g; s#^-+##; s#-+$##' | cut -c1-100)
          if [ -z "$BRANCH_TAG" ]; then
            BRANCH_TAG="manual"
          fi
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "BRANCH_TAG=${BRANCH_TAG}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${BRANCH_TAG}" \
            .

      - name: Push Docker image
        run: |
          docker push "${IMAGE_NAME}:${BRANCH_TAG}"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.35.2"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config

      - name: Deploy to K8s
        run: |
          (kubectl -n entebus set image deployment/entebus-server entebus-server=${IMAGE_NAME}:${BRANCH_TAG} && \
          kubectl -n entebus rollout status deployment/entebus-server --timeout=180s) || \
          (kubectl -n entebus rollout undo deployment/entebus-server && exit 1)

      - name: Remove deployed branch image from GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER_TYPE=$(gh api "/repos/${{ github.repository }}" --jq '.owner.type')
          OWNER="${{ github.repository_owner }}"
          PKG="${{ github.event.repository.name }}"

          if [ "$OWNER_TYPE" = "Organization" ]; then
            API_PATH="/orgs/${OWNER}/packages/container/${PKG}/versions"
          else
            API_PATH="/user/packages/container/${PKG}/versions"
          fi

          VERSION_IDS=$(gh api "$API_PATH" \
            --paginate \
            --jq '.[] | select(any(.metadata.container.tags[]; . == "'"${BRANCH_TAG}"'")) | .id')

          for VERSION_ID in $VERSION_IDS; do
            gh api --method DELETE "${API_PATH}/${VERSION_ID}"
          done
