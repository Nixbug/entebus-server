apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: entebus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
      initContainers:
        - name: fix-permissions
          image: busybox
          command: ["sh", "-c", "chown -R 999:999 /data && chmod -R 775 /data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: redis-data
              mountPath: /data
      containers:
        - name: redis
          image: redis:latest
          command:
            - sh
            - -c
            - 'redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes'
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: entebus-server-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: entebus-server-secret
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: redis-data
              mountPath: /data
              subPath: redis-db
      volumes:
        - name: redis-data
          hostPath:
            path: /mnt/redis-dev-data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: entebus
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
