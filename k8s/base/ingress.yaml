apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: entebus-ingress
  namespace: entebus
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "api.entebus.com"
      secretName: cloudflare-origin-cert
  rules:
    - host: "api.entebus.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: entebus-server-svc
                port:
                  number: 80
